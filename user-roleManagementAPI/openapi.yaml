openapi: 3.0.3
info:
  title: User Role Management API
  description: API for managing users, roles, and authentication in the Smart Inventory Management System
  version: 1.0.0
  contact:
    name: Smart Inventory Team
    email: support@smartinventory.com

servers:
  - url: /
    description: User Role Management API Server

paths:
  /actuator/health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description: Returns the health status of the application
      responses:
        "200":
          description: Application is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user with Firebase token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firebaseToken:
                  type: string
                  description: Firebase authentication token
              required:
                - firebaseToken
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  user:
                    type: object
        "401":
          description: Unauthorized
        "500":
          description: Internal server error

  /api/users:
    get:
      tags:
        - Users
      summary: Get all users
      description: Retrieve all users in the system
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "500":
          description: Internal server error

  /api/users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Retrieve a specific user by their ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                type: object
        "404":
          description: User not found
        "500":
          description: Internal server error

  /api/roles:
    get:
      tags:
        - Roles
      summary: Get all roles
      description: Retrieve all roles in the system
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "500":
          description: Internal server error

components:
  schemas:
    User:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        firebaseUid:
          type: string
        role:
          type: string
        accountStatus:
          type: string
        createdAt:
          type: string
          format: date-time

    Role:
      type: object
      properties:
        roleId:
          type: integer
          format: int64
        roleName:
          type: string
        description:
          type: string
