spring.application.name=user-roleManagementAPI

# Use PORT environment variable if available (for Choreo), fallback to 8084
server.port=${PORT:8084}

# PostgreSQL Database Configuration is handled in DatabaseConfig.java

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.org.springframework=INFO
logging.level.com.nimash=DEBUG

# Admin Configuration
app.admin.secret-key=${ADMIN_SECRET_KEY}

# Actuator Configuration for Health Checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator