<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Barcode Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .log { background: #f5f5f5; padding: 10px; border-radius: 5px; height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; }
        button { padding: 10px 20px; margin: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .connected { background: #d4edda; color: #155724; }
        .disconnected { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebSocket Barcode Test</h1>
        
        <div id="status" class="status disconnected">Status: Disconnected</div>
        
        <button onclick="connect()">Connect WebSocket</button>
        <button onclick="disconnect()">Disconnect</button>
        <button onclick="sendTestBarcode()">Send Test Barcode</button>
        <button onclick="clearLog()">Clear Log</button>
        
        <div class="log" id="log"></div>
    </div>

    <script>
        let ws = null;
        const userEmail = 'thivinu@gmail.com';
        
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${timestamp}] ${message}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function updateStatus(message, connected = false) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = `Status: ${message}`;
            statusDiv.className = `status ${connected ? 'connected' : 'disconnected'}`;
        }
        
        function connect() {
            if (ws) {
                ws.close();
            }
            
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.hostname;
            const port = window.location.protocol === 'https:' ? '8443' : '8080';
            const url = `${protocol}//${host}:${port}?user=${encodeURIComponent(userEmail)}`;
            
            log(`🔌 Connecting to: ${url}`);
            updateStatus('Connecting...');
            
            ws = new WebSocket(url);
            
            ws.onopen = function(event) {
                log('✅ WebSocket connection opened');
                updateStatus('Connected', true);
            };
            
            ws.onmessage = function(event) {
                log(`📨 Message received: ${event.data}`);
                try {
                    const message = JSON.parse(event.data);
                    if (message.type === 'barcode') {
                        log(`🔍 BARCODE DETECTED: ${message.barcode}`);
                        // Here you would normally send this to your sales page
                    }
                } catch (e) {
                    log(`❌ Error parsing message: ${e.message}`);
                }
            };
            
            ws.onclose = function(event) {
                log(`❌ WebSocket connection closed. Code: ${event.code}, Reason: ${event.reason}`);
                updateStatus('Disconnected');
                ws = null;
            };
            
            ws.onerror = function(error) {
                log(`❌ WebSocket error: ${error}`);
                updateStatus('Error');
            };
        }
        
        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }
        
        function sendTestBarcode() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const testBarcode = 'TEST123456789';
                const message = {
                    type: 'barcode',
                    barcode: testBarcode,
                    timestamp: new Date().toISOString(),
                    user: userEmail
                };
                ws.send(JSON.stringify(message));
                log(`📤 Sent test barcode: ${testBarcode}`);
            } else {
                log('❌ WebSocket not connected');
            }
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        // Auto-connect on page load
        window.onload = function() {
            connect();
        };
    </script>
</body>
</html>
