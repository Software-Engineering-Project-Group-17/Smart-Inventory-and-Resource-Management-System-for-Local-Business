<!DOCTYPE html>
<html>
<head>
    <title>Firebase Auth Test - HTTPS</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        input, button { padding: 10px; margin: 10px 0; width: 100%; box-sizing: border-box; }
        .result { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Firebase Authentication Test</h1>
        <p>Current URL: <span id="currentUrl"></span></p>
        <p>Protocol: <span id="protocol"></span></p>
        
        <div id="configTest" class="result info">
            <h3>Firebase Config Status</h3>
            <div id="configResult">Testing...</div>
        </div>

        <form id="loginForm">
            <h3>Test Login</h3>
            <input type="email" id="email" placeholder="Email" value="thivinu@gmail.com">
            <input type="password" id="password" placeholder="Password">
            <button type="submit">Test Login</button>
        </form>

        <div id="result"></div>
    </div>

    <!-- Firebase v9+ SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';

        // Show current environment info
        document.getElementById('currentUrl').textContent = window.location.href;
        document.getElementById('protocol').textContent = window.location.protocol;

        // Firebase config from your .env file
        const firebaseConfig = {
            apiKey: "AIzaSyDDN2_ED0HeEYZwvix3JZ-rQpURCX38DkQ",
            authDomain: "inventory-e9dd2.firebaseapp.com",
            projectId: "inventory-e9dd2",
            storageBucket: "inventory-e9dd2.firebasestorage.app",
            messagingSenderId: "582818524621",
            appId: "1:582818524621:web:d41205f0f109b56b992884"
        };

        let app, auth;

        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            document.getElementById('configResult').innerHTML = '<span style="color: green;">✅ Firebase initialized successfully</span>';
        } catch (error) {
            document.getElementById('configResult').innerHTML = `<span style="color: red;">❌ Firebase init failed: ${error.message}</span>`;
        }

        // Test login function
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            if (!email || !password) {
                resultDiv.innerHTML = '<div class="result error">Please enter both email and password</div>';
                return;
            }

            resultDiv.innerHTML = '<div class="result info">Testing login...</div>';

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                const token = await user.getIdToken();

                resultDiv.innerHTML = `
                    <div class="result success">
                        <h4>✅ Firebase Login Successful!</h4>
                        <p><strong>User:</strong> ${user.email}</p>
                        <p><strong>UID:</strong> ${user.uid}</p>
                        <p><strong>Token:</strong> ${token.substring(0, 50)}...</p>
                    </div>
                `;

                // Test API call
                const apiUrl = "https://ea21d711-74bd-4f7a-aca9-54d7e1149ad7-dev.e1-us-east-azure.choreoapis.dev/default/user-role2/v1.1/api/auth/login";
                
                try {
                    const apiResponse = await fetch(apiUrl, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${token}`
                        },
                        body: JSON.stringify({ email: email })
                    });

                    if (apiResponse.ok) {
                        const apiData = await apiResponse.json();
                        resultDiv.innerHTML += `
                            <div class="result success">
                                <h4>✅ Backend API Call Successful!</h4>
                                <pre>${JSON.stringify(apiData, null, 2)}</pre>
                            </div>
                        `;
                    } else {
                        resultDiv.innerHTML += `
                            <div class="result error">
                                <h4>❌ Backend API Call Failed</h4>
                                <p><strong>Status:</strong> ${apiResponse.status} ${apiResponse.statusText}</p>
                                <p><strong>Response:</strong> ${await apiResponse.text()}</p>
                            </div>
                        `;
                    }
                } catch (apiError) {
                    resultDiv.innerHTML += `
                        <div class="result error">
                            <h4>❌ Backend API Error</h4>
                            <p>${apiError.message}</p>
                        </div>
                    `;
                }

            } catch (error) {
                let errorMessage = error.message;
                
                // Handle specific Firebase auth errors
                if (error.code) {
                    switch (error.code) {
                        case 'auth/user-not-found':
                            errorMessage = 'No user found with this email address.';
                            break;
                        case 'auth/wrong-password':
                            errorMessage = 'Invalid password.';
                            break;
                        case 'auth/invalid-email':
                            errorMessage = 'Invalid email address.';
                            break;
                        case 'auth/too-many-requests':
                            errorMessage = 'Too many failed attempts. Please try again later.';
                            break;
                        case 'auth/network-request-failed':
                            errorMessage = 'Network error. Please check your connection.';
                            break;
                        default:
                            errorMessage = `Firebase Auth Error: ${error.code} - ${error.message}`;
                    }
                }

                resultDiv.innerHTML = `
                    <div class="result error">
                        <h4>❌ Login Failed</h4>
                        <p><strong>Error:</strong> ${errorMessage}</p>
                        <p><strong>Code:</strong> ${error.code || 'Unknown'}</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
