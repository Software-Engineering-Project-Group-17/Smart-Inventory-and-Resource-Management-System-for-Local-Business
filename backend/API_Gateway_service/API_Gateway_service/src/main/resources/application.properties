spring.application.name=API_Gateway_service

# ===============================
# Server and App Configuration
# ===============================
server.port=8080

# ===============================
# Routes for API Gateway
# ===============================

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081/
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=customer-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082/
spring.cloud.gateway.routes[1].predicates[0]=Path=/customer/**

spring.cloud.gateway.routes[2].id=inventory-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083/
spring.cloud.gateway.routes[2].predicates[0]=Path=/inventory/**


spring.cloud.gateway.routes[3].id=notification-service
spring.cloud.gateway.routes[3].uri=http://localhost:8084/
spring.cloud.gateway.routes[3].predicates[0]=Path=/notification/**

spring.cloud.gateway.routes[4].id=order_management-service
spring.cloud.gateway.routes[4].uri=http://localhost:8085/
spring.cloud.gateway.routes[4].predicates[0]=Path=/order/**

spring.cloud.gateway.routes[5].id=supplier-service
spring.cloud.gateway.routes[5].uri=http://localhost:8086/
spring.cloud.gateway.routes[5].predicates[0]=Path=/suppliers/**





# ===============================
# CORS Configuration
# ===============================
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=*

# ===============================
# Actuator Endpoints
# ===============================
management.endpoints.web.exposure.include=*
